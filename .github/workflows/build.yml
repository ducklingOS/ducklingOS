name: Build ducklingOS 1 x64 (GRUB Bootloader)

on:
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bau-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools \
            xorriso \
            mtools \
            wget \
            rsync \
            gcc \
            make \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            docker.io \
            zstd

      - name: Minimales RootFS erstellen
        run: |
          mkdir -p build/squashfs/rootfs
          mkdir -p build/iso/casper

          sudo docker run --name duckling_base ubuntu:24.04 /bin/true
          sudo docker export duckling_base | sudo tar -C build/squashfs/rootfs -xf -
          sudo docker rm duckling_base

      - name: Branding kopieren
        run: |
          sudo cp lsb-release build/squashfs/rootfs/etc/lsb-release
          sudo cp os-release build/squashfs/rootfs/etc/os-release

          sudo mkdir -p build/squashfs/rootfs/usr/share/backgrounds/duckling
          sudo cp duckling_wallpaper.jpg build/squashfs/rootfs/usr/share/backgrounds/duckling/default.jpg

          sudo mkdir -p build/squashfs/rootfs/etc/skel/.config

          if [ -d skel/.config ]; then
            sudo cp -r skel/.config/* build/squashfs/rootfs/etc/skel/.config/
          fi

      - name: Live-System konfigurieren
        run: |
          sudo mount --bind /dev build/squashfs/rootfs/dev
          sudo mount --bind /dev/pts build/squashfs/rootfs/dev/pts
          sudo mount --bind /proc build/squashfs/rootfs/proc
          sudo mount --bind /sys build/squashfs/rootfs/sys

          sudo cp /etc/resolv.conf build/squashfs/rootfs/etc/resolv.conf

          sudo chroot build/squashfs/rootfs apt-get update

          sudo DEBIAN_FRONTEND=noninteractive chroot build/squashfs/rootfs \
            apt-get install -y --no-install-recommends \
            linux-image-generic \
            initramfs-tools \
            live-boot \
            casper

          sudo DEBIAN_FRONTEND=noninteractive chroot build/squashfs/rootfs \
            apt-get install -y --no-install-recommends \
            ubuntu-desktop-minimal \
            gdm3 \
            dbus-x11 \
            calamares

          sudo chroot build/squashfs/rootfs apt-get autoremove -y
          sudo chroot build/squashfs/rootfs apt-get clean

          sudo chroot build/squashfs/rootfs useradd -m -s /bin/bash -G sudo duckling
          sudo chroot build/squashfs/rootfs passwd -d duckling

          sudo mkdir -p build/squashfs/rootfs/etc/gdm3

          sudo tee build/squashfs/rootfs/etc/gdm3/custom.conf >/dev/null <<EOF
          [daemon]
          AutomaticLoginEnable=true
          AutomaticLogin=duckling
          EOF

          sudo umount build/squashfs/rootfs/dev/pts
          sudo umount build/squashfs/rootfs/dev
          sudo umount build/squashfs/rootfs/proc
          sudo umount build/squashfs/rootfs/sys

      - name: SquashFS erstellen
        run: |
          sudo mksquashfs build/squashfs/rootfs build/iso/casper/filesystem.squashfs -comp xz

          sudo cp "$(ls build/squashfs/rootfs/boot/vmlinuz-* | tail -1)" build/iso/casper/vmlinuz
          sudo cp "$(ls build/squashfs/rootfs/boot/initrd.img-* | tail -1)" build/iso/casper/initrd

      - name: GRUB konfigurieren
        run: |
          mkdir -p build/iso/boot/grub

          cat > build/iso/boot/grub/grub.cfg <<EOF
          set timeout=5
          set default=0

          menuentry "ducklingOS 1" {
              linux /casper/vmlinuz boot=casper quiet splash ---
              initrd /casper/initrd
          }
          EOF

      - name: ISO erstellen
        run: |
          sudo grub-mkrescue \
            -o ducklingOS_1_x64.iso \
            build/iso \
            -- \
            -volid ducklingOS_1

      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ducklingOS-1-ISO
          path: ducklingOS_1_x64.iso
