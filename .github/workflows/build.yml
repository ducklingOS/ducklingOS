name: Build ducklingOS 1 x64 (GRUB Bootloader)
on: 
  push:
    branches: [ main ]

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
    - name: Code aus GitHub auschecken
      uses: actions/checkout@v4

    - name: Bau-Werkzeuge installieren
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          squashfs-tools xorriso mtools wget rsync gcc make \
          grub-pc-bin grub-efi-amd64-bin grub-common

    - name: Minimales RootFS via Docker erstellen
      run: |
        mkdir -p build/squashfs/rootfs build/iso/casper
        sudo docker run --name duckling_base ubuntu:24.04 /bin/true
        sudo docker export duckling_base | sudo tar -C build/squashfs/rootfs -xf -
        sudo docker rm duckling_base

    - name: ducklingOS Branding einspielen
      run: |
        sudo cp lsb-release build/squashfs/rootfs/etc/lsb-release
        sudo cp os-release build/squashfs/rootfs/os-release
        sudo mkdir -p build/squashfs/rootfs/usr/share/backgrounds/duckling/
        sudo cp duckling_wallpaper.jpg build/squashfs/rootfs/usr/share/backgrounds/duckling/default.jpg
        
        # Globales KDE-Hintergrundbild für alle neuen Benutzer
        sudo mkdir -p build/squashfs/rootfs/etc/skel/.config
        sudo tee build/squashfs/rootfs/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc << 'EOF'
        [Containments][1][Wallpaper][org.kde.image][General]
        Image=file:///usr/share/backgrounds/duckling/default.jpg
        EOF

        if [ -d "skel/.config" ]; then sudo cp -r skel/.config/* build/squashfs/rootfs/etc/skel/.config/; fi

        # Calamares Konfiguration ins System kopieren, falls im Repo vorhanden
        if [ -d "calamares" ]; then
          sudo mkdir -p build/squashfs/rootfs/etc/calamares/
          sudo cp -r calamares/* build/squashfs/rootfs/etc/calamares/
        fi

    - name: Live-System konfigurieren & User fixen
      run: |
        sudo mount --bind /dev build/squashfs/rootfs/dev
        sudo mount --bind /proc build/squashfs/rootfs/proc
        sudo mount --bind /sys build/squashfs/rootfs/sys
        sudo cp /etc/resolv.conf build/squashfs/rootfs/etc/resolv.conf
        sudo chroot build/squashfs/rootfs apt-get update
        
        # System-Pakete, KDE Plasma, SDDM und Calamares installieren
        sudo DEBIAN_FRONTEND=noninteractive chroot build/squashfs/rootfs apt-get install -y --no-install-recommends linux-image-generic initramfs-tools live-boot casper
        sudo DEBIAN_FRONTEND=noninteractive chroot build/squashfs/rootfs apt-get install -y kubuntu-desktop calamares calamares-settings-ubuntu sddm dbus-x11 polkitd
        
        # 1. Den unerwünschten Ubuntu-User komplett löschen, falls vorhanden
        sudo chroot build/squashfs/rootfs userdel -r ubuntu 2>/dev/null || true

        # 2. Echten duckling Live-User anlegen (ohne Passwort für direkten Einstieg)
        sudo chroot build/squashfs/rootfs useradd -m -s /bin/bash -G sudo duckling
        sudo chroot build/squashfs/rootfs passwd -d duckling

        # 3. SDDM Autologin für den duckling-User erzwingen (umgeht den Login-Screen)
        sudo mkdir -p build/squashfs/rootfs/etc/sddm.conf.d
        sudo tee build/squashfs/rootfs/etc/sddm.conf.d/autologin.conf << 'EOF'
        [Autologin]
        User=duckling
        Session=plasma

        [Theme]
        Current=breeze
        Background=/usr/share/backgrounds/duckling/default.jpg
        EOF

        # 4. Calamares Autostart einrichten
        sudo mkdir -p build/squashfs/rootfs/etc/xdg/autostart
        sudo tee build/squashfs/rootfs/etc/xdg/autostart/calamares.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=ducklingOS Installieren
        Exec=sudo calamares
        Icon=calamares
        Terminal=false
        StartupNotify=true
        EOF

        sudo umount build/squashfs/rootfs/dev
        sudo umount build/squashfs/rootfs/proc
        sudo umount build/squashfs/rootfs/sys

    - name: Kernel & Initrd extrahieren, SquashFS bauen
      run: |
        sudo mksquashfs build/squashfs/rootfs build/iso/casper/filesystem.squashfs -comp xz
        sudo cp $(ls -v build/squashfs/rootfs/boot/vmlinuz-* | tail -n 1) build/iso/casper/vmlinuz
        sudo cp $(ls -v build/squashfs/rootfs/boot/initrd.img-* | tail -n 1) build/iso/casper/initrd
        sudo chmod -R 755 build/

    - name: GRUB-Konfiguration schreiben
      run: |
        mkdir -p build/iso/boot/grub
        cat > build/iso/boot/grub/grub.cfg << 'EOF'
        set timeout=5
        set default=0
        menuentry "ducklingOS 1 Starten & Installieren" {
            linux /casper/vmlinuz boot=casper username=duckling hostname=duckling quiet splash ---
            initrd /casper/initrd
        }
        EOF

    - name: ISO erstellen mit grub-mkrescue (BIOS + UEFI)
      run: |
        sudo grub-mkrescue -o ducklingOS_1_x64.iso build/iso \
          -- -volid "ducklingOS_1"

    - name: ISO als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: ducklingOS-1-ISO
        path: ducklingOS_1_x64.iso
